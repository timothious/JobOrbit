# Dev/CI PostgreSQL for migration tests. Host port 55432 avoids clashing with other local databases.
services:
  db:
    image: postgres:16-alpine
    container_name: joborbit-db
    environment:
      POSTGRES_USER: joborbit
      POSTGRES_PASSWORD: joborbit
      POSTGRES_DB: joborbit
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - joborbit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joborbit"]
      interval: 5s
      retries: 10

volumes:
  joborbit-pgdata:
