name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: joborbit
          POSTGRES_PASSWORD: joborbit
          POSTGRES_DB: joborbit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U joborbit" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest
        env:
          JOBORBIT_TEST_POSTGRES_URL: postgresql+psycopg://joborbit:joborbit@localhost:5432/joborbit
      - name: Dependency audit
        run: uv export --format requirements-txt --no-hashes > /tmp/requirements.txt && uvx pip-audit -r /tmp/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Initial JS bundle ≤ 250 KB gzip (NFR-004)
        run: |
          size=$(gzip -c dist/assets/index-*.js | wc -c)
          echo "Initial bundle: $((size / 1024)) KB gzip"
          test "$size" -le $((250 * 1024))
      - run: npm audit --omit=dev --audit-level=high
